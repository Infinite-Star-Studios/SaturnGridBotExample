[package]
name = "saturn-grid"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A fast, safety-first grid trading bot for Saturn DEX (v4 pools) on the Phantasma blockchain."
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "saturn_grid"
path = "src/lib.rs"

[[bin]]
name = "saturn-grid"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier", "json"] }
zeroize = "1.9.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
